spring.application.name=Assignment1

# --- Speech-to-text upstream ---
# Model name is taken verbatim from the assignment brief.
app.openai.base-url=https://api.openai.com/v1
app.openai.model=gpt-4o-mini-transcribe
app.openai.api-key=${OPENAI_API_KEY:}

# --- Upload limits ---
# The upstream service accepts files up to 25 MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Concurrent blocking Cloud calls ---
# Each transcription waits for an upstream HTTP response. Virtual threads let
# many such requests wait concurrently without exhausting Tomcat's platform
# thread pool, while preserving ordinary readable blocking controller code.
spring.threads.virtual.enabled=true


# --- Graceful shutdown ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
