<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Speech to Text</title>

  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<main>
  <header>
    <h1>Speech to Text</h1>
    <p>
      Record a short audio clip and your transcript will appear below.
    </p>
  </header>

  <section aria-labelledby="recording-heading">
    <h2 id="recording-heading">Record Audio</h2>

    <button type="button" id="start-button" class="control-button">
      Start Recording
    </button>

    <button type="button" id="stop-button" class="control-button" disabled>
      Stop Recording
    </button>

    <p id="recording-indicator" hidden>
      <span aria-hidden="true">●</span> Recording
    </p>

    <p class="timer-line">
      Recording time:
      <span id="timer">00:00</span>
    </p>

    <p id="status" aria-live="polite">
      Ready
    </p>
  </section>


  <section aria-labelledby="transcript-heading">
    <h2 id="transcript-heading">Transcript</h2>

    <div id="transcript" aria-live="polite">
      <p class="placeholder">Your transcript will appear here.</p>
    </div>
  </section>


  <div id="error" role="alert" hidden>
    <p id="error-message"></p>
  </div>

</main>

<script src="js/app.js"></script>

</body>
</html>
